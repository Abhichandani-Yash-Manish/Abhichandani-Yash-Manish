<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Open collaboration channel</title>
  <desc id="desc">Bring the ambitious idea. I will bring the system questions.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#1B3850" stroke-width="1"/>
    </pattern>
    <linearGradient id="signalFade" x1="0" x2="1">
      <stop offset="0" stop-color="#73A2FF"/>
      <stop offset=".58" stop-color="#A58BFF"/>
      <stop offset="1" stop-color="#FF806D"/>
    </linearGradient>
    <style>
      .display { font-family: "Arial Narrow", "Avenir Next Condensed", "Roboto Condensed", sans-serif; font-weight: 850; letter-spacing: -1.8px; }
      .body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: 1.5px; }
      
    </style>
  </defs>
  <rect width="1200" height="300" rx="32" fill="#0C1B2A"/>
  <rect x="18" y="18" width="1164" height="264" rx="22" fill="url(#grid)" opacity=".78"/>
  <rect x="18.5" y="18.5" width="1163" height="263" rx="22" fill="none" stroke="#2B4C63"/>
  
  <path d="M48 56H60V112H48" fill="none" stroke="#2CB4A1" stroke-width="7"/>
  <text x="82" y="73" class="mono" font-size="14" font-weight="800" fill="#2CB4A1">OPEN CHANNEL / COLLABORATION</text>
  <text x="82" y="137" class="display" font-size="44" fill="#F4F8FB">BRING THE AMBITIOUS IDEA.</text>
  <text x="82" y="181" class="display" font-size="44" fill="#73A2FF">I'LL BRING THE SYSTEM QUESTIONS.</text>
  <path d="M82 218H1118" stroke="url(#signalFade)" stroke-width="5" stroke-linecap="round"/>
  <text x="82" y="258" class="mono" font-size="12" font-weight="800" fill="#94ACBD">EMAIL · LINKEDIN · GITHUB</text>
  <text x="1118" y="258" class="mono" font-size="11" text-anchor="end" fill="#94ACBD">OBSERVE → QUESTION → DECIDE → BUILD → VERIFY</text>

</svg>
