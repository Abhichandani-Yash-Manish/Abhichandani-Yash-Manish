<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Build Circuit</title>
  <desc id="desc">A project circuit connecting Turnout Lab, GlobeTrotter, PRISM IEMS, PharmaGuard, BEOS Plus, and F1 Apex to different engineering boundaries.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#1B3850" stroke-width="1"/>
    </pattern>
    <linearGradient id="signalFade" x1="0" x2="1">
      <stop offset="0" stop-color="#73A2FF"/>
      <stop offset=".58" stop-color="#A58BFF"/>
      <stop offset="1" stop-color="#FF806D"/>
    </linearGradient>
    <style>
      .display { font-family: "Arial Narrow", "Avenir Next Condensed", "Roboto Condensed", sans-serif; font-weight: 850; letter-spacing: -1.8px; }
      .body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: 1.5px; }
      
    </style>
  </defs>
  <rect width="1200" height="520" rx="32" fill="#0C1B2A"/>
  <rect x="18" y="18" width="1164" height="484" rx="22" fill="url(#grid)" opacity=".78"/>
  <rect x="18.5" y="18.5" width="1163" height="483" rx="22" fill="none" stroke="#2B4C63"/>
  
  <text x="58" y="65" class="mono" font-size="14" font-weight="800" fill="#A58BFF">BUILD CIRCUIT / SYSTEMS WITH DIFFERENT FAILURE MODES</text>
  <text x="1142" y="65" class="mono" font-size="12" text-anchor="end" fill="#94ACBD">NO SKILL BARS. FOLLOW THE EVIDENCE.</text>

  <path d="M189 151C96 201 104 348 222 400C370 465 474 361 582 390C728 429 805 484 973 399C1105 332 1088 182 961 140C828 96 734 180 608 147C454 106 318 81 189 151Z" fill="none" stroke="#2B4C63" stroke-width="15" stroke-linecap="round"/>
  <path d="M189 151C96 201 104 348 222 400C370 465 474 361 582 390C728 429 805 484 973 399C1105 332 1088 182 961 140C828 96 734 180 608 147C454 106 318 81 189 151Z" fill="none" stroke="url(#signalFade)" stroke-width="5" stroke-linecap="round" stroke-dasharray="5 12"/>

  <g transform="translate(600 281)">
    <circle r="104" fill="#17364B" stroke="#73A2FF" stroke-width="3"/>
    <circle r="80" fill="#0C1B2A" stroke="#1B3850" stroke-width="2"/>
    <text y="-8" class="display" font-size="52" text-anchor="middle" fill="#F4F8FB">Y/A</text>
    <text y="24" class="mono" font-size="11" font-weight="800" text-anchor="middle" fill="#94ACBD">BUILD CORE</text>
    <text y="47" class="mono" font-size="9" text-anchor="middle" fill="#2CB4A1">SYSTEMS / ML / PRODUCT</text>
  </g>

  <g transform="translate(177 145)">
    <circle r="15" fill="#FF806D" stroke="#0C1B2A" stroke-width="5"/>
    <rect x="-78" y="27" width="205" height="67" rx="12" fill="#112A3D"/>
    <text x="-60" y="55" class="display" font-size="23" fill="#F4F8FB">TURNOUT LAB</text>
    <text x="-60" y="78" class="mono" font-size="10" fill="#94ACBD">ML INTEGRITY</text>
  </g>
  <g transform="translate(260 402)">
    <circle r="15" fill="#73A2FF" stroke="#0C1B2A" stroke-width="5"/>
    <rect x="-70" y="-101" width="220" height="67" rx="12" fill="#112A3D"/>
    <text x="-52" y="-73" class="display" font-size="23" fill="#F4F8FB">GLOBETROTTER</text>
    <text x="-52" y="-50" class="mono" font-size="10" fill="#94ACBD">PRODUCT SYSTEMS</text>
  </g>
  <g transform="translate(773 432)">
    <circle r="15" fill="#A58BFF" stroke="#0C1B2A" stroke-width="5"/>
    <rect x="-85" y="-103" width="190" height="67" rx="12" fill="#112A3D"/>
    <text x="-67" y="-75" class="display" font-size="23" fill="#F4F8FB">PRISM IEMS</text>
    <text x="-67" y="-52" class="mono" font-size="10" fill="#94ACBD">AGENT WORKFLOWS</text>
  </g>
  <g transform="translate(1020 356)">
    <circle r="15" fill="#2CB4A1" stroke="#0C1B2A" stroke-width="5"/>
    <rect x="-195" y="29" width="243" height="67" rx="12" fill="#112A3D"/>
    <text x="-177" y="57" class="display" font-size="23" fill="#F4F8FB">PHARMAGUARD / BEOS+</text>
    <text x="-177" y="80" class="mono" font-size="10" fill="#94ACBD">PUBLIC-IMPACT SYSTEMS</text>
  </g>
  <g transform="translate(954 139)">
    <circle r="15" fill="#73A2FF" stroke="#0C1B2A" stroke-width="5"/>
    <rect x="-145" y="28" width="190" height="67" rx="12" fill="#112A3D"/>
    <text x="-127" y="56" class="display" font-size="23" fill="#F4F8FB">F1 APEX</text>
    <text x="-127" y="79" class="mono" font-size="10" fill="#94ACBD">MOTORSPORT PRODUCT</text>
  </g>

</svg>
