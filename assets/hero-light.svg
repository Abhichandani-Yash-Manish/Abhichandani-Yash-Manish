<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540" role="img" aria-labelledby="title desc">
  <title id="title">Yash Abhichandani — Engineering Flight Recorder</title>
  <desc id="desc">I audit the assumption, then I build the system. Computer Engineering and Data Science.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#D2E1E9" stroke-width="1"/>
    </pattern>
    <linearGradient id="signalFade" x1="0" x2="1">
      <stop offset="0" stop-color="#2D6CDF"/>
      <stop offset=".58" stop-color="#7158D9"/>
      <stop offset="1" stop-color="#FF705D"/>
    </linearGradient>
    <style>
      .display { font-family: "Arial Narrow", "Avenir Next Condensed", "Roboto Condensed", sans-serif; font-weight: 850; letter-spacing: -1.8px; }
      .body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: 1.5px; }
      
      .draw { stroke-dasharray: 1500; stroke-dashoffset: 0; animation: draw 1.8s cubic-bezier(.2,.75,.25,1) .15s both; }
      .arrive { opacity: 1; animation: arrive .3s ease-out both; }
      .a1 { animation-delay: .35s; } .a2 { animation-delay: .65s; }
      .a3 { animation-delay: .95s; } .a4 { animation-delay: 1.25s; }
      .a5 { animation-delay: 1.55s; }
      .scan { animation: scan 4s ease-in-out infinite; }
      @keyframes draw { from { stroke-dashoffset: 1500; } to { stroke-dashoffset: 0; } }
      @keyframes arrive { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
      @keyframes scan { 0%, 100% { opacity: .15; } 50% { opacity: .65; } }
      @media (prefers-reduced-motion: reduce) {
        .draw, .arrive, .scan { animation: none; opacity: 1; stroke-dashoffset: 0; }
      }
    
    </style>
  </defs>
  <rect width="1200" height="540" rx="32" fill="#F3F7FA"/>
  <rect x="18" y="18" width="1164" height="504" rx="22" fill="url(#grid)" opacity=".78"/>
  <rect x="18.5" y="18.5" width="1163" height="503" rx="22" fill="none" stroke="#B6CAD6"/>
  
  <path d="M40 78H52V132H40" fill="none" stroke="#FF705D" stroke-width="7"/>
  <text x="72" y="82" class="mono" font-size="15" font-weight="750" fill="#2D6CDF">ENGINEERING FLIGHT RECORDER / YAM-PROFILE</text>
  <text x="1128" y="82" class="mono" font-size="14" text-anchor="end" fill="#536C7E">GUJARAT · INDIA</text>

  <text x="72" y="168" class="display" font-size="69" fill="#10243C">YASH</text>
  <text x="72" y="236" class="display" font-size="69" fill="#10243C">ABHICHANDANI</text>
  <text x="76" y="282" class="body" font-size="27" font-weight="680" fill="#536C7E">I audit the assumption. Then I build the system.</text>
  <rect x="76" y="307" width="470" height="38" rx="19" fill="#E8F0F5"/>
  <text x="96" y="332" class="mono" font-size="13" font-weight="750" fill="#2D6CDF">COMPUTER ENGINEERING × DATA SCIENCE</text>

  <g transform="translate(878 196)">
    <circle r="134" fill="#E8F0F5" stroke="#B6CAD6" stroke-width="2"/>
    <circle r="108" fill="none" stroke="#D2E1E9" stroke-width="1"/>
    <circle r="82" fill="none" stroke="#2D6CDF" stroke-width="2" stroke-dasharray="3 10"/>
    <path class="scan" d="M0 0L76-64A100 100 0 0 1 99 14Z" fill="#2D6CDF" opacity=".25"/>
    <path d="M-104 4A104 104 0 0 1 66-81" fill="none" stroke="url(#signalFade)" stroke-width="8" stroke-linecap="round"/>
    <circle cx="-104" cy="4" r="8" fill="#FF705D"/>
    <circle cx="66" cy="-81" r="8" fill="#178F7F"/>
    <text y="-5" class="display" font-size="59" text-anchor="middle" fill="#10243C">Y/A</text>
    <text y="28" class="mono" font-size="12" font-weight="750" text-anchor="middle" fill="#536C7E">SYSTEMS / ML / PRODUCT</text>
  </g>

  <g transform="translate(1026 137)">
    <rect width="102" height="42" rx="8" fill="#DDE9F0"/>
    <text x="12" y="17" class="mono" font-size="9" fill="#536C7E">MODE</text>
    <text x="12" y="33" class="mono" font-size="12" font-weight="800" fill="#178F7F">BUILD</text>
  </g>
  <g transform="translate(1026 188)">
    <rect width="102" height="42" rx="8" fill="#DDE9F0"/>
    <text x="12" y="17" class="mono" font-size="9" fill="#536C7E">METHOD</text>
    <text x="12" y="33" class="mono" font-size="12" font-weight="800" fill="#2D6CDF">VERIFY</text>
  </g>
  <g transform="translate(1026 239)">
    <rect width="102" height="42" rx="8" fill="#DDE9F0"/>
    <text x="12" y="17" class="mono" font-size="9" fill="#536C7E">STATUS</text>
    <text x="12" y="33" class="mono" font-size="12" font-weight="800" fill="#FF705D">CURIOUS</text>
  </g>

  <path d="M72 421H226L262 387H417L460 431H622L670 374H828L873 416H1128" fill="none" stroke="#B6CAD6" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="draw" d="M72 421H226L262 387H417L460 431H622L670 374H828L873 416H1128" fill="none" stroke="url(#signalFade)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <g class="arrive a1"><circle cx="112" cy="421" r="9" fill="#F3F7FA" stroke="#2D6CDF" stroke-width="4"/><text x="112" y="470" class="mono" font-size="12" font-weight="800" text-anchor="middle" fill="#536C7E">OBSERVE</text></g>
  <g class="arrive a2"><circle cx="307" cy="387" r="9" fill="#F3F7FA" stroke="#2D6CDF" stroke-width="4"/><text x="307" y="470" class="mono" font-size="12" font-weight="800" text-anchor="middle" fill="#536C7E">QUESTION</text></g>
  <g class="arrive a3"><circle cx="536" cy="431" r="10" fill="#FF705D" stroke="#F3F7FA" stroke-width="4"/><text x="536" y="470" class="mono" font-size="12" font-weight="850" text-anchor="middle" fill="#FF705D">DECIDE</text></g>
  <g class="arrive a4"><circle cx="748" cy="374" r="9" fill="#F3F7FA" stroke="#7158D9" stroke-width="4"/><text x="748" y="470" class="mono" font-size="12" font-weight="800" text-anchor="middle" fill="#536C7E">BUILD</text></g>
  <g class="arrive a5"><circle cx="1011" cy="416" r="10" fill="#178F7F" stroke="#F3F7FA" stroke-width="4"/><text x="1011" y="470" class="mono" font-size="12" font-weight="850" text-anchor="middle" fill="#178F7F">VERIFY</text></g>
  <text x="1128" y="510" class="mono" font-size="10" text-anchor="end" fill="#536C7E">THE DECISION IS PART OF THE DELIVERABLE</text>

</svg>
