<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="270" viewBox="0 0 1200 270" role="img" aria-labelledby="title desc">
  <title id="title">Operating system — four non-negotiables</title>
  <desc id="desc">Data before model, contracts before screens, fallbacks before demos, evidence before claims.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#1B3850" stroke-width="1"/>
    </pattern>
    <linearGradient id="signalFade" x1="0" x2="1">
      <stop offset="0" stop-color="#73A2FF"/>
      <stop offset=".58" stop-color="#A58BFF"/>
      <stop offset="1" stop-color="#FF806D"/>
    </linearGradient>
    <style>
      .display { font-family: "Arial Narrow", "Avenir Next Condensed", "Roboto Condensed", sans-serif; font-weight: 850; letter-spacing: -1.8px; }
      .body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: 1.5px; }
      
    </style>
  </defs>
  <rect width="1200" height="270" rx="32" fill="#0C1B2A"/>
  <rect x="18" y="18" width="1164" height="234" rx="22" fill="url(#grid)" opacity=".78"/>
  <rect x="18.5" y="18.5" width="1163" height="233" rx="22" fill="none" stroke="#2B4C63"/>
  
  <text x="58" y="65" class="mono" font-size="14" font-weight="800" fill="#73A2FF">OPERATING SYSTEM / FOUR NON-NEGOTIABLES</text>
  <text x="1142" y="65" class="mono" font-size="12" text-anchor="end" fill="#94ACBD">PROOF &gt; THEATRE</text>
  <path d="M58 88H1142" stroke="#2B4C63" stroke-width="2"/>

  <g transform="translate(58 112)">
    <rect width="252" height="105" rx="15" fill="#112A3D"/>
    <text x="20" y="36" class="mono" font-size="12" font-weight="800" fill="#FF806D">01 / DATA</text>
    <text x="20" y="72" class="display" font-size="28" fill="#F4F8FB">BEFORE MODEL</text>
  </g>
  <g transform="translate(326 112)">
    <rect width="252" height="105" rx="15" fill="#112A3D"/>
    <text x="20" y="36" class="mono" font-size="12" font-weight="800" fill="#73A2FF">02 / CONTRACTS</text>
    <text x="20" y="72" class="display" font-size="28" fill="#F4F8FB">BEFORE SCREENS</text>
  </g>
  <g transform="translate(594 112)">
    <rect width="252" height="105" rx="15" fill="#112A3D"/>
    <text x="20" y="36" class="mono" font-size="12" font-weight="800" fill="#A58BFF">03 / FALLBACKS</text>
    <text x="20" y="72" class="display" font-size="28" fill="#F4F8FB">BEFORE DEMOS</text>
  </g>
  <g transform="translate(862 112)">
    <rect width="280" height="105" rx="15" fill="#112A3D"/>
    <text x="20" y="36" class="mono" font-size="12" font-weight="800" fill="#2CB4A1">04 / EVIDENCE</text>
    <text x="20" y="72" class="display" font-size="28" fill="#F4F8FB">BEFORE CLAIMS</text>
  </g>
  <path d="M80 236H1120" stroke="url(#signalFade)" stroke-width="5" stroke-linecap="round"/>

</svg>
