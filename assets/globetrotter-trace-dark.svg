<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">GlobeTrotter — a travel product that survives the demo</title>
  <desc id="desc">A persistent collaborative travel workspace with 55 destinations, 390 activities, three navigation languages, keyless maps, and no required paid API keys.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#1B3850" stroke-width="1"/>
    </pattern>
    <linearGradient id="signalFade" x1="0" x2="1">
      <stop offset="0" stop-color="#73A2FF"/>
      <stop offset=".58" stop-color="#A58BFF"/>
      <stop offset="1" stop-color="#FF806D"/>
    </linearGradient>
    <style>
      .display { font-family: "Arial Narrow", "Avenir Next Condensed", "Roboto Condensed", sans-serif; font-weight: 850; letter-spacing: -1.8px; }
      .body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: 1.5px; }
      
    </style>
  </defs>
  <rect width="1200" height="430" rx="32" fill="#0C1B2A"/>
  <rect x="18" y="18" width="1164" height="394" rx="22" fill="url(#grid)" opacity=".78"/>
  <rect x="18.5" y="18.5" width="1163" height="393" rx="22" fill="none" stroke="#2B4C63"/>
  
  <text x="58" y="65" class="mono" font-size="14" font-weight="800" fill="#73A2FF">FEATURED TRACE / 02 / FULL-STACK PRODUCT</text>
  <text x="58" y="123" class="display" font-size="50" fill="#F4F8FB">GLOBETROTTER</text>
  <text x="58" y="169" class="display" font-size="35" fill="#73A2FF">A TRAVEL PRODUCT THAT SURVIVES THE DEMO.</text>

  <g transform="translate(58 212)">
    <path d="M14 70H163L205 25H363L410 94H567L620 47H768" fill="none" stroke="#2B4C63" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M14 70H163L205 25H363L410 94H567L620 47H768" fill="none" stroke="url(#signalFade)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <g><circle cx="14" cy="70" r="10" fill="#FF806D"/><text x="14" y="132" class="mono" font-size="11" font-weight="800" text-anchor="middle" fill="#94ACBD">IDEA</text></g>
    <g><circle cx="205" cy="25" r="10" fill="#0C1B2A" stroke="#73A2FF" stroke-width="4"/><text x="205" y="132" class="mono" font-size="11" font-weight="800" text-anchor="middle" fill="#94ACBD">PLAN</text></g>
    <g><circle cx="410" cy="94" r="10" fill="#0C1B2A" stroke="#A58BFF" stroke-width="4"/><text x="410" y="132" class="mono" font-size="11" font-weight="800" text-anchor="middle" fill="#94ACBD">COLLABORATE</text></g>
    <g><circle cx="620" cy="47" r="10" fill="#2CB4A1"/><text x="620" y="132" class="mono" font-size="11" font-weight="800" text-anchor="middle" fill="#94ACBD">PUBLISH</text></g>
    <g><circle cx="768" cy="47" r="10" fill="#73A2FF"/><text x="768" y="132" class="mono" font-size="11" font-weight="800" text-anchor="middle" fill="#94ACBD">COPY</text></g>
  </g>

  <g transform="translate(862 66)">
    <rect width="280" height="270" rx="20" fill="#17364B"/>
    <text x="24" y="38" class="mono" font-size="12" font-weight="800" fill="#94ACBD">PRODUCT PAYLOAD</text>
    <text x="24" y="102" class="display" font-size="49" fill="#73A2FF">55</text>
    <text x="100" y="100" class="mono" font-size="12" font-weight="750" fill="#94ACBD">DESTINATIONS</text>
    <text x="24" y="163" class="display" font-size="49" fill="#A58BFF">390</text>
    <text x="125" y="161" class="mono" font-size="12" font-weight="750" fill="#94ACBD">ACTIVITIES</text>
    <text x="24" y="218" class="display" font-size="34" fill="#2CB4A1">3</text>
    <text x="66" y="216" class="mono" font-size="12" font-weight="750" fill="#94ACBD">NAV LANGUAGES</text>
    <rect x="24" y="234" width="232" height="5" rx="2.5" fill="url(#signalFade)"/>
  </g>

  <rect x="58" y="358" width="498" height="40" rx="20" fill="#112A3D"/>
  <text x="82" y="383" class="mono" font-size="12" font-weight="850" fill="#2CB4A1">NO REQUIRED PAID API KEYS / CORE JOURNEY PERSISTS</text>
  <text x="1142" y="383" class="mono" font-size="12" font-weight="750" text-anchor="end" fill="#94ACBD">LAUNCH WORKSPACE →</text>

</svg>
