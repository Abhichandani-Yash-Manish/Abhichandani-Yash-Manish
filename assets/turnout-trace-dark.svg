<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">Turnout Lab — when the benchmark was the bug</title>
  <desc id="desc">100 of 100 test records overlapped training. The response was quarantine, grouped validation, and calibrated evaluation across 25 outer folds.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#1B3850" stroke-width="1"/>
    </pattern>
    <linearGradient id="signalFade" x1="0" x2="1">
      <stop offset="0" stop-color="#73A2FF"/>
      <stop offset=".58" stop-color="#A58BFF"/>
      <stop offset="1" stop-color="#FF806D"/>
    </linearGradient>
    <style>
      .display { font-family: "Arial Narrow", "Avenir Next Condensed", "Roboto Condensed", sans-serif; font-weight: 850; letter-spacing: -1.8px; }
      .body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: 1.5px; }
      
    </style>
  </defs>
  <rect width="1200" height="430" rx="32" fill="#0C1B2A"/>
  <rect x="18" y="18" width="1164" height="394" rx="22" fill="url(#grid)" opacity=".78"/>
  <rect x="18.5" y="18.5" width="1163" height="393" rx="22" fill="none" stroke="#2B4C63"/>
  
  <text x="58" y="65" class="mono" font-size="14" font-weight="800" fill="#FF806D">FEATURED TRACE / 01 / APPLIED ML</text>
  <text x="58" y="123" class="display" font-size="50" fill="#F4F8FB">TURNOUT LAB</text>
  <text x="58" y="169" class="display" font-size="35" fill="#FF806D">WHEN THE BENCHMARK WAS THE BUG.</text>

  <g transform="translate(58 207)">
    <rect width="630" height="142" rx="18" fill="#112A3D"/>
    <path d="M42 71H142M190 71H290M338 71H438M486 71H586" stroke="#2B4C63" stroke-width="5" stroke-linecap="round"/>
    <g transform="translate(42 36)"><circle cx="0" cy="35" r="18" fill="#FF806D"/><text x="0" y="41" class="mono" font-size="12" font-weight="900" text-anchor="middle" fill="#FFFFFF">!</text><text x="0" y="105" class="mono" font-size="11" font-weight="800" text-anchor="start" fill="#94ACBD">OVERLAP</text></g>
    <g transform="translate(190 36)"><circle cx="0" cy="35" r="18" fill="#0C1B2A" stroke="#73A2FF" stroke-width="4"/><text x="0" y="41" class="mono" font-size="11" font-weight="900" text-anchor="middle" fill="#73A2FF">Q</text><text x="0" y="105" class="mono" font-size="11" font-weight="800" text-anchor="start" fill="#94ACBD">QUARANTINE</text></g>
    <g transform="translate(338 36)"><circle cx="0" cy="35" r="18" fill="#0C1B2A" stroke="#A58BFF" stroke-width="4"/><text x="0" y="41" class="mono" font-size="10" font-weight="900" text-anchor="middle" fill="#A58BFF">CV</text><text x="0" y="105" class="mono" font-size="11" font-weight="800" text-anchor="start" fill="#94ACBD">GROUPED OOF</text></g>
    <g transform="translate(486 36)"><circle cx="0" cy="35" r="18" fill="#2CB4A1"/><text x="0" y="41" class="mono" font-size="11" font-weight="900" text-anchor="middle" fill="#FFFFFF">✓</text><text x="0" y="105" class="mono" font-size="11" font-weight="800" text-anchor="start" fill="#94ACBD">CALIBRATE</text></g>
  </g>

  <g transform="translate(720 52)">
    <rect width="422" height="297" rx="20" fill="#17364B"/>
    <text x="24" y="38" class="mono" font-size="12" font-weight="800" fill="#94ACBD">RECORDED EVIDENCE</text>
    <text x="24" y="102" class="display" font-size="49" fill="#FF806D">100 / 100</text>
    <text x="26" y="128" class="mono" font-size="11" font-weight="750" fill="#94ACBD">TEST RECORDS OVERLAPPED TRAINING</text>
    <path d="M24 150H398" stroke="#2B4C63" stroke-width="2"/>
    <text x="24" y="203" class="display" font-size="38" fill="#73A2FF">25</text>
    <text x="90" y="202" class="mono" font-size="12" font-weight="750" fill="#94ACBD">OUTER FOLDS</text>
    <text x="24" y="254" class="display" font-size="32" fill="#F4F8FB">0.635</text>
    <text x="144" y="253" class="mono" font-size="11" fill="#94ACBD">ROC-AUC</text>
    <text x="248" y="254" class="display" font-size="32" fill="#F4F8FB">0.221</text>
    <text x="358" y="253" class="mono" font-size="11" fill="#94ACBD">BRIER</text>
    <rect x="24" y="270" width="374" height="5" rx="2.5" fill="url(#signalFade)"/>
  </g>

  <text x="58" y="391" class="mono" font-size="13" font-weight="850" fill="#2CB4A1">HONEST SIGNAL &gt; PERFECT STORY</text>
  <text x="1142" y="391" class="mono" font-size="12" font-weight="750" text-anchor="end" fill="#94ACBD">OPEN CASE FILE →</text>

</svg>
