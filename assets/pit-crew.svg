<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="350" viewBox="0 0 1200 350" role="img" aria-labelledby="title desc">
  <title id="title">Pit crew — technology under the bodywork</title>
  <desc id="desc">A capability map across product engineering, intelligent systems, data, and delivery. Claims point to inspectable code and live systems instead of skill percentages.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#03050A"/>
      <stop offset=".58" stop-color="#07101B"/>
      <stop offset="1" stop-color="#17070C"/>
    </linearGradient>
    <linearGradient id="signal" x1="0" x2="1">
      <stop offset="0" stop-color="#FF254A"/>
      <stop offset=".48" stop-color="#9A6CFF"/>
      <stop offset="1" stop-color="#00E5FF"/>
    </linearGradient>
    <pattern id="grid" width="38" height="38" patternUnits="userSpaceOnUse">
      <path d="M38 0H0V38" fill="none" stroke="#122235" stroke-width="1"/>
    </pattern>
    <pattern id="checks" width="24" height="24" patternUnits="userSpaceOnUse">
      <rect width="12" height="12" fill="#F8FBFF"/><rect x="12" y="12" width="12" height="12" fill="#F8FBFF"/>
    </pattern>
    <filter id="redGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="7" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="cyanGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .display { font-family: "Arial Narrow", "Avenir Next Condensed", Impact, sans-serif; font-weight: 900; font-stretch: condensed; letter-spacing: -1.4px; }
      .body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: 1.25px; }
      
    </style>
  </defs>
  <rect width="1200" height="350" rx="28" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="348" rx="27" fill="none" stroke="#1D3045" stroke-width="2"/>
  <rect x="20" y="20" width="1160" height="310" rx="18" fill="url(#grid)" opacity=".72"/>
  
  <text x="48" y="50" class="mono" font-size="12" font-weight="850" fill="#FFC857">PIT CREW / TECHNOLOGY UNDER THE BODYWORK</text>
  <text x="48" y="103" class="display" font-size="39" fill="#F8FBFF">TOOLS CHANGE. THE ENGINEERING LOOP DOESN'T.</text>
  <g transform="translate(48 140)">
    <rect width="252" height="136" rx="14" fill="#101F31" stroke="#FF254A"/>
    <text x="18" y="29" class="mono" font-size="10" font-weight="850" fill="#FF254A">01 / PRODUCT</text>
    <text x="18" y="61" class="display" font-size="21" fill="#F8FBFF">TYPESCRIPT · REACT</text><text x="18" y="86" class="display" font-size="21" fill="#F8FBFF">NEXT.JS · PRISMA</text><text x="18" y="113" class="mono" font-size="9" fill="#8494A8">AUTH · STATE · PERSISTENCE</text>
    <rect x="270" width="252" height="136" rx="14" fill="#101F31" stroke="#00E5FF"/>
    <text x="288" y="29" class="mono" font-size="10" font-weight="850" fill="#00E5FF">02 / INTELLIGENCE</text>
    <text x="288" y="61" class="display" font-size="21" fill="#F8FBFF">PYTHON · SCIKIT</text><text x="288" y="86" class="display" font-size="21" fill="#F8FBFF">LANGGRAPH · RAG</text><text x="288" y="113" class="mono" font-size="9" fill="#8494A8">CALIBRATION · EVALUATION</text>
    <rect x="540" width="252" height="136" rx="14" fill="#101F31" stroke="#9A6CFF"/>
    <text x="558" y="29" class="mono" font-size="10" font-weight="850" fill="#9A6CFF">03 / DATA</text>
    <text x="558" y="61" class="display" font-size="21" fill="#F8FBFF">POSTGRES · SQLITE</text><text x="558" y="86" class="display" font-size="21" fill="#F8FBFF">SUPABASE · TURSO</text><text x="558" y="113" class="mono" font-size="9" fill="#8494A8">SCHEMAS · MIGRATIONS · AUDIT</text>
    <rect x="810" width="278" height="136" rx="14" fill="#101F31" stroke="#26E6A4"/>
    <text x="828" y="29" class="mono" font-size="10" font-weight="850" fill="#26E6A4">04 / DELIVERY</text>
    <text x="828" y="61" class="display" font-size="21" fill="#F8FBFF">GIT · CI · VERCEL</text><text x="828" y="86" class="display" font-size="21" fill="#F8FBFF">DOCKER · BROWSER QA</text><text x="828" y="113" class="mono" font-size="9" fill="#8494A8">REPRODUCIBLE · TESTED · SHIPPED</text>
  </g>
  <text x="48" y="318" class="mono" font-size="10" fill="#8494A8">NO PERCENTAGE BARS. FOLLOW THE CODE, TESTS, ARTIFACTS, AND LIVE JOURNEYS.</text>

</svg>
