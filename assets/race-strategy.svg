<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-labelledby="title desc">
  <title id="title">Race strategy — no vanity laps</title>
  <desc id="desc">Yash's engineering loop: audit data, design contracts, build fallbacks, test real journeys, and ship evidence.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#03050A"/>
      <stop offset=".58" stop-color="#07101B"/>
      <stop offset="1" stop-color="#17070C"/>
    </linearGradient>
    <linearGradient id="signal" x1="0" x2="1">
      <stop offset="0" stop-color="#FF254A"/>
      <stop offset=".48" stop-color="#9A6CFF"/>
      <stop offset="1" stop-color="#00E5FF"/>
    </linearGradient>
    <pattern id="grid" width="38" height="38" patternUnits="userSpaceOnUse">
      <path d="M38 0H0V38" fill="none" stroke="#122235" stroke-width="1"/>
    </pattern>
    <pattern id="checks" width="24" height="24" patternUnits="userSpaceOnUse">
      <rect width="12" height="12" fill="#F8FBFF"/><rect x="12" y="12" width="12" height="12" fill="#F8FBFF"/>
    </pattern>
    <filter id="redGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="7" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="cyanGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .display { font-family: "Arial Narrow", "Avenir Next Condensed", Impact, sans-serif; font-weight: 900; font-stretch: condensed; letter-spacing: -1.4px; }
      .body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: 1.25px; }
      
    </style>
  </defs>
  <rect width="1200" height="260" rx="28" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="258" rx="27" fill="none" stroke="#1D3045" stroke-width="2"/>
  <rect x="20" y="20" width="1160" height="220" rx="18" fill="url(#grid)" opacity=".72"/>
  
  <text x="48" y="52" class="mono" font-size="12" font-weight="800" fill="#FF254A">RACE STRATEGY / HOW I BUILD</text>
  <text x="48" y="111" class="display" font-size="48" fill="#F8FBFF">NO VANITY LAPS.</text>
  <text x="48" y="147" class="body" font-size="16" fill="#8494A8">Speed matters. So do the systems that keep the result honest when pressure arrives.</text>

  <g transform="translate(48 191)">
    <path d="M0 0H1088" stroke="#1D3045" stroke-width="8" stroke-linecap="round"/>
    <path d="M0 0H1088" stroke="url(#signal)" stroke-width="3" stroke-linecap="round"/>
    <g transform="translate(40)"><circle r="10" fill="#FF254A"/><text y="39" text-anchor="middle" class="mono" font-size="10" font-weight="800" fill="#F8FBFF">AUDIT DATA</text></g>
    <g transform="translate(310)"><circle r="10" fill="#FFC857"/><text y="39" text-anchor="middle" class="mono" font-size="10" font-weight="800" fill="#F8FBFF">DESIGN CONTRACTS</text></g>
    <g transform="translate(590)"><circle r="10" fill="#9A6CFF"/><text y="39" text-anchor="middle" class="mono" font-size="10" font-weight="800" fill="#F8FBFF">BUILD FALLBACKS</text></g>
    <g transform="translate(850)"><circle r="10" fill="#00E5FF"/><text y="39" text-anchor="middle" class="mono" font-size="10" font-weight="800" fill="#F8FBFF">TEST JOURNEYS</text></g>
    <g transform="translate(1060)"><circle r="10" fill="#26E6A4"/><text y="39" text-anchor="end" class="mono" font-size="10" font-weight="800" fill="#F8FBFF">SHIP PROOF</text></g>
  </g>

</svg>
