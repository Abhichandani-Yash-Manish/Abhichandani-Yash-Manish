<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="270" viewBox="0 0 1200 270" role="img" aria-labelledby="title desc">
  <title id="title">The paddock — selected builds</title>
  <desc id="desc">Selected systems across motorsport, agentic institution operations, scientific exploration, pharmacy operations, and blood emergency coordination.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#03050A"/>
      <stop offset=".58" stop-color="#07101B"/>
      <stop offset="1" stop-color="#17070C"/>
    </linearGradient>
    <linearGradient id="signal" x1="0" x2="1">
      <stop offset="0" stop-color="#FF254A"/>
      <stop offset=".48" stop-color="#9A6CFF"/>
      <stop offset="1" stop-color="#00E5FF"/>
    </linearGradient>
    <pattern id="grid" width="38" height="38" patternUnits="userSpaceOnUse">
      <path d="M38 0H0V38" fill="none" stroke="#122235" stroke-width="1"/>
    </pattern>
    <pattern id="checks" width="24" height="24" patternUnits="userSpaceOnUse">
      <rect width="12" height="12" fill="#F8FBFF"/><rect x="12" y="12" width="12" height="12" fill="#F8FBFF"/>
    </pattern>
    <filter id="redGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="7" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="cyanGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .display { font-family: "Arial Narrow", "Avenir Next Condensed", Impact, sans-serif; font-weight: 900; font-stretch: condensed; letter-spacing: -1.4px; }
      .body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: 1.25px; }
      
    </style>
  </defs>
  <rect width="1200" height="270" rx="28" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="268" rx="27" fill="none" stroke="#1D3045" stroke-width="2"/>
  <rect x="20" y="20" width="1160" height="230" rx="18" fill="url(#grid)" opacity=".72"/>
  
  <text x="48" y="50" class="mono" font-size="12" font-weight="850" fill="#9A6CFF">PADDOCK / SELECTED BUILDS</text>
  <text x="48" y="108" class="display" font-size="44" fill="#F8FBFF">DIFFERENT SYSTEMS. SAME STANDARD.</text>
  <text x="48" y="142" class="body" font-size="16" fill="#8494A8">Every project below has a different failure mode—and a public trail you can inspect.</text>
  <g transform="translate(48 174)">
    <rect width="258" height="58" rx="10" fill="#101F31" stroke="#FF254A"/><text x="18" y="25" class="display" font-size="19" fill="#F8FBFF">F1 APEX</text><text x="18" y="44" class="mono" font-size="8" fill="#8494A8">MOTORSPORT PRODUCT</text>
    <rect x="276" width="258" height="58" rx="10" fill="#101F31" stroke="#00E5FF"/><text x="294" y="25" class="display" font-size="19" fill="#F8FBFF">PRISM IEMS</text><text x="294" y="44" class="mono" font-size="8" fill="#8494A8">AGENTIC INSTITUTION OPS</text>
    <rect x="552" width="258" height="58" rx="10" fill="#101F31" stroke="#FFC857"/><text x="570" y="25" class="display" font-size="19" fill="#F8FBFF">COSMIC LENS</text><text x="570" y="44" class="mono" font-size="8" fill="#8494A8">SCIENTIFIC EXPLORATION</text>
    <rect x="828" width="260" height="58" rx="10" fill="#101F31" stroke="#26E6A4"/><text x="846" y="25" class="display" font-size="19" fill="#F8FBFF">PHARMAGUARD / BEOS+</text><text x="846" y="44" class="mono" font-size="8" fill="#8494A8">PUBLIC-IMPACT SYSTEMS</text>
  </g>

</svg>
