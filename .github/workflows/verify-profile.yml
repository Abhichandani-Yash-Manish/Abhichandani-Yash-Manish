name: Verify profile

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  profile-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Rebuild visual system
        run: |
          python scripts/build_visuals.py
          git diff --exit-code -- assets
      - name: Verify README and local assets
        run: python scripts/verify_profile.py
